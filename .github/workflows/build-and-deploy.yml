name: Build Dachrepublik and deploy

# Boundary + OSM (Geofabrik) → Bayern LoD2 roofs → Zensus 2022 grid → walking distances → web layers → GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q tippecanoe osmium-tool
          pip install -r requirements.txt
          mkdir -p logs input build docs/data
      - name: Cache downloads (LoD2 tiles, Zensus grid)
        uses: actions/cache@v4
        with:
          path: |
            input/lod2
            input/*.pbf
            input/*.zip
          key: munich-centre-v2-${{ github.run_id }}
          restore-keys: munich-centre-
      - name: Boundary and OpenStreetMap
        run: python pipeline/a_boundary_osm.py 2>&1 | tee logs/a.log; test ${PIPESTATUS[0]} -eq 0
      - name: LoD2 roofs
        run: python pipeline/b_lod2.py 2>&1 | tee logs/b.log; test ${PIPESTATUS[0]} -eq 0
      - name: Zensus 2022
        run: python pipeline/c_zensus.py 2>&1 | tee logs/c.log; test ${PIPESTATUS[0]} -eq 0
      - name: Walking distances
        run: python pipeline/d_network.py 2>&1 | tee logs/d.log; test ${PIPESTATUS[0]} -eq 0
      - name: Web layers
        run: python pipeline/e_web.py 2>&1 | tee logs/e.log; test ${PIPESTATUS[0]} -eq 0
      - name: Summary
        if: always()
        run: |
          for f in logs/*.log; do echo "::notice title=$(basename $f)::$(tail -c 1000 $f | tr '\n' ' ')"; done
          { echo '### Dachrepublik build'; echo '```'; tail -n 40 logs/*.log; echo '```'; } >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: docs
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  video:
    # LinkedIn video + thumbnail, rendered from the built site; only for commits with [video] in the message
    needs: build
    if: contains(github.event.head_commit.message, '[video]')
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: docs
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Render
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg > /dev/null
          npm i --no-save playwright@1.48.2 > /dev/null && npx playwright install --with-deps chromium > /dev/null
          node pipeline/video.mjs 2>&1 | tee video.log
      - name: Push to media branch
        run: |
          mkdir -p /tmp/m && cp media/*.mp4 media/*.png media/*.jpg /tmp/m/
          cd /tmp/m && git init -q -b media && git config user.name Claude && git config user.email noreply@anthropic.com
          git add . && git commit -qm "Rendered video ($(date -u +%F))"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" media
